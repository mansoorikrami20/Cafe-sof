<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8f7"><title>Соф — любимая еда рядом</title><link rel="stylesheet" href="style.css"></head>
<body><div class="desktop-note"><a href="#" class="brand">СОФ<span>ЧАЙХАНА</span></a><h1>Вкус дома.<br>В вашем ритме.</h1><p>Меню, любимые блюда и удобный заказ.<br>Всё самое нужное — под рукой.</p><div class="design-tags"><span>Меню</span><span>Корзина</span><span>Оформление</span></div><small>Интерактивный прототип · Заказы не отправляются</small></div>
<div class="app"><header><button class="location" id="branchButton"><span class="icon-box" data-icon="pin"></span><span><small>Ваш филиал</small><strong id="branchLabel">Выберите филиал <span>⌄</span></strong></span></button><div class="header-actions"><button class="circle" id="notificationButton" aria-label="Уведомления" onclick="toast('Пока нет уведомлений')"><i data-icon="bell"></i></button><button class="circle" id="headerCart" aria-label="Открыть корзину"><i data-icon="bag"></i><b id="cartBadge" hidden>0</b></button></div></header>
<main id="view"></main><nav id="nav" aria-label="Основная навигация"></nav></div>
<dialog id="branchDialog"><div class="sheet-head"><h2>Где будем заказывать?</h2><button class="circle" onclick="this.closest('dialog').close()" aria-label="Закрыть">✕</button></div><div id="branchOptions"><p class="muted">Загружаем список настроенных филиалов…</p></div></dialog>
<dialog id="productDialog"></dialog><dialog id="accountDialog"></dialog><div id="toast" role="status"></div><script src="app.js"></script><script src="catalog.js"></script></body></html>
