<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11110f">
  <title>NOIR — премиальное меню</title>
  <style>
    :root{--accent:#c7945b;--accent-soft:#e8c69d;--bg:#11110f;--panel:#1b1a17;--panel-2:#24221e;--text:#f6f0e7;--muted:#a7a198;--line:#ffffff12;--radius:25px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#332a20 0,#181713 29%,var(--bg) 62%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}.shell{width:min(100%,520px);margin:auto;min-height:100vh;padding:0 18px 118px}.top{position:sticky;top:0;z-index:20;margin:0 -18px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(#11110ff2 70%,transparent);backdrop-filter:blur(18px)}.brand-row{display:flex;align-items:center;gap:13px}.mark{width:48px;height:48px;border:1px solid #d6aa7560;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#31291f,#171612);box-shadow:inset 0 0 0 5px #11110f,0 10px 24px #0008;color:var(--accent-soft);font:700 18px Georgia}.brand{flex:1}.brand small{display:block;color:var(--accent);font-size:9px;letter-spacing:2.7px;text-transform:uppercase;margin-bottom:4px}.brand strong{font:500 21px Georgia;letter-spacing:.3px}.icon{width:43px;height:43px;border:1px solid var(--line);border-radius:50%;background:#ffffff08;color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.25s}.icon:hover{border-color:#c7945b66;background:#c7945b15}.icon svg,.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}.greeting{padding:24px 1px 17px}.greeting small{font-size:10px;color:var(--accent);letter-spacing:2.5px;text-transform:uppercase}.greeting h1{font:500 38px/1.03 Georgia;margin:8px 0 0;letter-spacing:-1.5px}.greeting h1 em{font-style:italic;color:var(--accent-soft)}.search{display:flex;gap:10px;margin:0 0 17px}.search label{height:54px;flex:1;display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:18px;background:#ffffff09;padding:0 17px;backdrop-filter:blur(16px)}.search svg{width:20px;stroke:var(--muted);fill:none;stroke-width:1.7}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}.search input::placeholder{color:#827d75}.filter{width:54px;border-radius:18px;background:var(--accent);border:0;color:#15130f;display:grid;place-items:center}.filter svg{stroke:#15130f}.hero{position:relative;overflow:hidden;border-radius:var(--radius);height:216px;box-shadow:0 25px 60px #0009;margin-bottom:25px}.slides{height:100%;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.slides::-webkit-scrollbar{display:none}.slide{position:relative;min-width:100%;height:100%;scroll-snap-align:start;overflow:hidden;background:linear-gradient(120deg,#33281e,#171511);isolation:isolate}.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#11110fea 0%,#11110fb8 43%,transparent 72%);z-index:-1}.slide img{position:absolute;right:-22px;bottom:-22px;width:65%;height:115%;object-fit:contain;filter:drop-shadow(0 18px 16px #0009);z-index:-2;opacity:.72;transform:scale(.93) translateX(18px);transition:1s cubic-bezier(.2,.8,.2,1)}.slide.active img{opacity:1;transform:scale(1) translateX(0)}.hero-copy{padding:29px 22px;width:64%;opacity:0;transform:translateY(12px);transition:.65s cubic-bezier(.2,.8,.2,1)}.slide.active .hero-copy{opacity:1;transform:none}.hero-copy small{color:var(--accent-soft);font-size:9px;letter-spacing:2px;text-transform:uppercase}.hero-copy h2{font:500 29px/1 Georgia;margin:8px 0}.hero-copy p{font-size:11px;line-height:1.45;color:#d5cec4;margin:0 0 15px}.hero-copy button{border:1px solid #d5a97355;border-radius:99px;background:#c7945b18;color:var(--accent-soft);padding:9px 13px;font-size:10px;font-weight:700;letter-spacing:.3px;cursor:pointer}.dots{position:absolute;z-index:3;bottom:15px;left:22px;display:flex;gap:6px}.dots button{border:0;padding:0;width:5px;height:5px;border-radius:99px;background:#ffffff50;transition:.35s}.dots button.active{width:22px;background:var(--accent)}.section-head{display:flex;align-items:end;justify-content:space-between;margin:5px 2px 15px}.section-head small{color:var(--accent);font-size:9px;letter-spacing:2px;text-transform:uppercase}.section-head h2{font:500 28px Georgia;margin:4px 0 0}.section-head button{border:0;background:none;color:var(--accent-soft);font-size:11px}.cats{display:flex;gap:9px;overflow:auto;margin:0 -18px 22px;padding:0 18px 4px;scrollbar-width:none}.cat{white-space:nowrap;border:1px solid var(--line);border-radius:99px;background:#ffffff07;color:var(--muted);padding:10px 15px;font-size:11px;transition:.25s}.cat.active{background:var(--accent);border-color:var(--accent);color:#17130f;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{position:relative;border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,#211f1b,#171612);overflow:hidden;min-width:0;box-shadow:0 15px 30px #0003}.photo{position:relative;height:158px;background:radial-gradient(circle at 50% 58%,#5b4935 0,#2a241d 35%,#181714 70%);cursor:pointer}.photo:after{content:"";position:absolute;inset:auto 12% 9px;height:14px;border-radius:50%;background:#0008;filter:blur(8px)}.photo img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 15px 9px #0008);transition:.35s}.card:hover .photo img{transform:translateY(-4px) scale(1.025)}.heart{position:absolute;z-index:3;top:10px;right:10px;width:31px;height:31px;border:1px solid #ffffff18;border-radius:50%;background:#12110ec4;color:#e4d8ca}.heart.on{color:var(--accent);background:#c7945b1f}.copy{padding:13px 13px 14px}.copy small{color:var(--accent);font-size:8px;letter-spacing:1.25px}.copy h3{font:500 16px/1.1 Georgia;margin:6px 0 5px}.copy p{height:31px;overflow:hidden;margin:0;color:var(--muted);font-size:9px;line-height:1.45}.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px}.price{font:600 18px Georgia}.price span{font:10px Inter;color:var(--accent);margin-left:2px}.plus{border:0;width:35px;height:35px;border-radius:50%;background:var(--accent);color:#15120e;font-size:22px;line-height:1}.bottom{position:fixed;z-index:30;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),490px);height:72px;border:1px solid #ffffff17;border-radius:25px;background:#1a1916e8;backdrop-filter:blur(24px);box-shadow:0 17px 45px #000b;display:flex;align-items:center;justify-content:space-around}.nav{position:relative;border:0;background:none;color:#817d76;padding:8px 12px}.nav.active{color:var(--accent-soft)}.nav.active:after{content:"";position:absolute;left:50%;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}.badge{position:absolute;top:1px;right:5px;background:var(--accent);color:#14110d;border-radius:99px;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;font-size:9px;font-weight:800}.drawer{position:fixed;z-index:50;inset:0;background:#0009;display:none;align-items:end;justify-content:center}.drawer.open{display:flex}.sheet{width:min(100%,520px);max-height:82vh;overflow:auto;border:1px solid #ffffff17;border-radius:30px 30px 0 0;background:#1c1b18;padding:22px 20px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -30px 80px #000}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{font:500 28px Georgia;margin:0}.close{border:1px solid var(--line);background:#ffffff08;color:white;border-radius:50%;width:38px;height:38px}.cart-line{display:flex;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cart-line img{width:68px;height:58px;object-fit:contain;background:#26231e;border-radius:14px}.cart-line div{flex:1}.cart-line b{font:500 15px Georgia}.cart-line small{display:block;color:var(--muted);margin-top:4px}.checkout{width:100%;height:52px;border:0;border-radius:17px;background:var(--accent);color:#16120e;font-weight:800;margin-top:18px}.empty{color:var(--muted);text-align:center;padding:35px 0}.modal-photo{width:100%;height:240px;object-fit:contain;background:radial-gradient(circle,#574631,#1a1916 65%);border-radius:23px;margin:18px 0}.detail-desc{color:var(--muted);font-size:13px;line-height:1.6}.detail-row{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.detail-row strong{font:600 25px Georgia;color:var(--accent-soft)}@media(min-width:800px){body:before{content:"NOIR";position:fixed;left:8vw;top:25vh;font:500 13vw Georgia;color:#ffffff05;letter-spacing:2vw}.shell{padding-top:20px}.top{border-radius:0 0 24px 24px}.hero{height:236px}.photo{height:180px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand-row"><div class="mark">N</div><div class="brand"><small>Restaurant collection</small><strong>NOIR Atelier</strong></div><button class="icon" aria-label="Уведомления">${bell}</button><button class="icon" id="cartTop" aria-label="Корзина">${bag}</button></div></header>
    <section class="greeting"><small>Добрый вечер</small><h1>Вкус, который<br><em>остаётся.</em></h1></section>
    <div class="search"><label>${search}<input id="search" placeholder="Найти любимое блюдо..." aria-label="Поиск блюда"></label><button class="filter" id="showAll" aria-label="Все блюда">${sliders}</button></div>
    <section class="hero" aria-label="Специальные предложения"><div class="slides" id="slides"></div><div class="dots" id="dots"></div></section>
    <div class="section-head"><div><small>Авторская кухня</small><h2 id="sectionTitle">Все блюда</h2></div><button id="reset">Смотреть все →</button></div>
    <div class="cats" id="cats"></div><section class="grid" id="grid"></section>
  </main>
  <nav class="bottom" aria-label="Основная навигация"><button class="nav active" aria-label="Меню">${home}</button><button class="nav" aria-label="Избранное">${heart}</button><button class="nav" aria-label="Заказы">${receipt}</button><button class="nav" id="cartNav" aria-label="Корзина">${bag}<span class="badge" id="badge" hidden>0</span></button><button class="nav" aria-label="Профиль">${user}</button></nav>
  <div class="drawer" id="drawer"><div class="sheet"><div class="sheet-head"><h2 id="sheetTitle">Корзина</h2><button class="close" id="close">✕</button></div><div id="sheetBody"></div></div></div>
  <script>
    const icon=(p)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${p}"/></svg>`;
    const bell=icon('M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4'),bag=icon('M6 8h12l1 13H5L6 8Zm3 0V6a3 3 0 0 1 6 0v2'),search=icon('m20 20-4.5-4.5m2.5-5A7.5 7.5 0 1 1 3 10a7.5 7.5 0 0 1 15 0'),sliders=icon('M4 7h16M8 7a2 2 0 1 0 0 .01M4 17h16m-4 0a2 2 0 1 0 0 .01'),home=icon('m3 11 9-8 9 8v10H3V11Zm7 10v-7h4v7'),heart=icon('M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z'),receipt=icon('M6 3h12v18l-3-2-3 2-3-2-3 2V3Zm3 5h6m-6 4h6'),user=icon('M20 21a8 8 0 0 0-16 0m8-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8');
    document.body.innerHTML=document.body.innerHTML.replaceAll('${bell}',bell).replaceAll('${bag}',bag).replaceAll('${search}',search).replaceAll('${sliders}',sliders).replaceAll('${home}',home).replaceAll('${heart}',heart).replaceAll('${receipt}',receipt).replaceAll('${user}',user);
    const dishes=[
      {id:'plov',name:'Плов',cat:'Горячее',desc:'Рассыпчатый рис, нежное мясо и ароматные специи',weight:'450 г',price:450,img:'assets/plov-cutout.png'},
      {id:'kazan',name:'Казан-кебаб',cat:'Горячее',desc:'Говядина, золотистый картофель и свежая зелень',weight:'400 г',price:550,img:'assets/kazan-cutout.png'},
      {id:'shurpa',name:'Шурпа',cat:'Супы',desc:'Наваристый бульон, мясо и сезонные овощи',weight:'450 г',price:400,img:'assets/shurpa-cutout.png'},
      {id:'roast',name:'Жаркое',cat:'Горячее',desc:'Томлёная говядина с картофелем и специями',weight:'450 г',price:500,img:'assets/roast-cutout.png'},
      {id:'fatir',name:'Фатир-шурпа',cat:'Супы',desc:'Домашний суп с мясом и свежей лепёшкой',weight:'600 г',price:500,img:'assets/fatir-cutout.png'},
      {id:'lamb',name:'Казан-кебаб из баранины',cat:'Горячее',desc:'Нежная баранина, картофель и восточные специи',weight:'400 г',price:600,img:'assets/kazan-cutout.png'}
    ];
    const banners=[
      {eyebrow:'Вкусно вместе',title:'Семейный ужин',text:'Тёплые блюда для особенного вечера',cta:'Открыть плов',img:'assets/plov-cutout.png',type:'dish',target:'plov'},
      {eyebrow:'С пылу с жару',title:'Горячее меню',text:'Мясо, специи и настоящее тепло',cta:'Смотреть горячее',img:'assets/kazan-cutout.png',type:'cat',target:'Горячее'},
      {eyebrow:'Каждый день',title:'Домашние супы',text:'Насыщенный вкус и щедрая порция',cta:'Смотреть супы',img:'assets/shurpa-cutout.png',type:'cat',target:'Супы'}
    ];
    let category='Все',query='',slide=0,timer,cart={},favorites=new Set();
    const qs=s=>document.querySelector(s),money=n=>n.toLocaleString('ru-RU')+' ₽';
    function renderBanners(){qs('#slides').innerHTML=banners.map((b,i)=>`<article class="slide ${i===slide?'active':''}" data-slide="${i}"><div class="hero-copy"><small>${b.eyebrow}</small><h2>${b.title}</h2><p>${b.text}</p><button data-action="${b.type}" data-target="${b.target}">${b.cta} →</button></div><img src="${b.img}" alt=""></article>`).join('');qs('#dots').innerHTML=banners.map((_,i)=>`<button aria-label="Баннер ${i+1}" class="${i===slide?'active':''}" data-dot="${i}"></button>`).join('')}
    function go(i){slide=(i+banners.length)%banners.length;renderBanners();qs('#slides').scrollTo({left:qs('#slides').clientWidth*slide,behavior:'smooth'})}
    function restart(){clearInterval(timer);timer=setInterval(()=>go(slide+1),5000)}
    function renderCats(){let cs=['Все',...new Set(dishes.map(d=>d.cat))];qs('#cats').innerHTML=cs.map(c=>`<button class="cat ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('')}
    function visible(){return dishes.filter(d=>(category==='Все'||d.cat===category)&&d.name.toLowerCase().includes(query.toLowerCase()))}
    function renderGrid(){qs('#sectionTitle').textContent=query?'Результаты поиска':category==='Все'?'Все блюда':category;qs('#grid').innerHTML=visible().map(d=>`<article class="card"><div class="photo" data-detail="${d.id}"><button class="heart ${favorites.has(d.id)?'on':''}" data-fav="${d.id}" aria-label="В избранное">♡</button><img src="${d.img}" alt="${d.name}" loading="lazy"></div><div class="copy"><small>${d.cat.toUpperCase()}</small><h3>${d.name}</h3><p>${d.desc}</p><div class="card-foot"><div><span class="price">${d.price}<span>₽</span></span></div><button class="plus" data-add="${d.id}" aria-label="Добавить ${d.name}">+</button></div></div></article>`).join('')||'<p class="empty">Ничего не найдено</p>'}
    function render(){renderCats();renderGrid();let count=Object.values(cart).reduce((a,b)=>a+b,0);qs('#badge').hidden=!count;qs('#badge').textContent=count}
    function openCart(){qs('#sheetTitle').textContent='Ваш заказ';let ids=Object.keys(cart);qs('#sheetBody').innerHTML=ids.length?ids.map(id=>{let d=dishes.find(x=>x.id===id);return `<div class="cart-line"><img src="${d.img}" alt=""><div><b>${d.name}</b><small>${cart[id]} × ${money(d.price)}</small></div><strong>${money(cart[id]*d.price)}</strong></div>`}).join('')+`<button class="checkout">Оформить · ${money(ids.reduce((s,id)=>s+cart[id]*dishes.find(x=>x.id===id).price,0))}</button>`:'<p class="empty">Корзина пока пуста</p>';qs('#drawer').classList.add('open')}
    function openDetail(id){let d=dishes.find(x=>x.id===id);qs('#sheetTitle').textContent=d.name;qs('#sheetBody').innerHTML=`<img class="modal-photo" src="${d.img}" alt="${d.name}"><small style="color:var(--accent)">${d.cat.toUpperCase()} · ${d.weight}</small><p class="detail-desc">${d.desc}</p><div class="detail-row"><strong>${money(d.price)}</strong><button class="plus" data-add="${d.id}">+</button></div>`;qs('#drawer').classList.add('open')}
    document.addEventListener('click',e=>{let t=e.target.closest('button,[data-detail]');if(!t)return;if(t.dataset.cat){category=t.dataset.cat;query='';qs('#search').value='';render()}else if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;render();if(qs('#drawer').classList.contains('open'))openDetail(t.dataset.add)}else if(t.dataset.fav){e.stopPropagation();favorites.has(t.dataset.fav)?favorites.delete(t.dataset.fav):favorites.add(t.dataset.fav);renderGrid()}else if(t.dataset.detail)openDetail(t.dataset.detail);else if(t.dataset.dot){go(+t.dataset.dot);restart()}else if(t.dataset.action==='dish')openDetail(t.dataset.target);else if(t.dataset.action==='cat'){category=t.dataset.target;render();qs('#cats').scrollIntoView({behavior:'smooth',block:'center'})}});
    qs('#search').addEventListener('input',e=>{query=e.target.value;renderGrid()});qs('#showAll').onclick=qs('#reset').onclick=()=>{category='Все';query='';qs('#search').value='';render()};qs('#cartTop').onclick=qs('#cartNav').onclick=openCart;qs('#close').onclick=()=>qs('#drawer').classList.remove('open');qs('#drawer').onclick=e=>{if(e.target===qs('#drawer'))qs('#drawer').classList.remove('open')};
    renderBanners();render();restart();
  </script>
</body>
</html>
