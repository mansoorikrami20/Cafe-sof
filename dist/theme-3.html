<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12110f">
  <title>NOIR Atelier — премиальное меню</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme-3.css">
</head>
<body class="theme-noir">
  <div class="desktop-note">
    <a href="#" class="brand">NOIR<span>ATELIER</span></a>
    <h1>Вкус, который<br>остаётся.</h1>
    <p>Премиальная тёмная тема меню.<br>Все функции заказа — внутри.</p>
    <div class="design-tags"><span>Меню</span><span>Корзина</span><span>Оформление</span></div>
    <small>Тема №3 · NEXT Level Menu</small>
  </div>
  <div class="app">
    <header>
      <button class="location" id="branchButton">
        <span class="icon-box" data-icon="pin"></span>
        <span><small>Ваш филиал</small><strong id="branchLabel">Выберите филиал <span>⌄</span></strong></span>
      </button>
      <div class="header-actions">
        <button class="circle" id="notificationButton" aria-label="Уведомления" onclick="toast('Пока нет уведомлений')"><i data-icon="bell"></i></button>
        <button class="circle" id="headerCart" aria-label="Открыть корзину"><i data-icon="bag"></i><b id="cartBadge" hidden>0</b></button>
      </div>
    </header>
    <main id="view"></main>
    <nav id="nav" aria-label="Основная навигация"></nav>
  </div>
  <dialog id="branchDialog">
    <div class="sheet-head"><h2>Где будем заказывать?</h2><button class="circle" onclick="this.closest('dialog').close()" aria-label="Закрыть">✕</button></div>
    <div id="branchOptions"><p class="muted">Загружаем список настроенных филиалов…</p></div>
  </dialog>
  <dialog id="productDialog"></dialog>
  <dialog id="accountDialog"></dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
